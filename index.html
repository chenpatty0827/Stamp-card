<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧱 樂高集點卡</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
    background: #f7d948;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
}

.hidden {
    display: none !important;
}

.lego-card {
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 
        0 8px 0 #e0c030,
        0 12px 20px rgba(0,0,0,0.15);
    border: 4px solid #333;
    max-width: 500px;
    width: 100%;
}

.lego-title {
    font-size: 2rem;
    color: #d32f2f;
    text-align: center;
    text-shadow: 2px 2px 0 #fdd835;
    margin-bottom: 10px;
    font-weight: 900;
    letter-spacing: 2px;
}

.lego-btn {
    display: block;
    width: 100%;
    padding: 14px 24px;
    font-size: 1.1rem;
    font-weight: 700;
    border: 3px solid #333;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.1s ease;
    margin-top: 10px;
}

.lego-btn:active {
    transform: translateY(3px);
    box-shadow: none;
}

.screen {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
}

#main-screen {
    flex-direction: column;
    align-items: center;
    min-height: auto;
}

.login-card {
    text-align: center;
}

.login-subtitle {
    color: #555;
    margin-bottom: 20px;
    font-size: 1.1rem;
}

.lego-input {
    width: 100%;
    padding: 14px;
    font-size: 1.1rem;
    border: 3px solid #333;
    border-radius: 10px;
    margin-bottom: 10px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
}

.lego-input:focus {
    border-color: #1976d2;
    box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.2);
}

#login-btn {
    background: #4caf50;
    color: white;
    box-shadow: 0 5px 0 #388e3c;
}

#login-btn:hover {
    background: #43a047;
}

.error-msg {
    color: #d32f2f;
    margin-top: 10px;
    font-weight: 600;
}

.header {
    text-align: center;
    margin-bottom: 20px;
    width: 100%;
    max-width: 500px;
}

.stats {
    font-size: 1.3rem;
    font-weight: 700;
    color: #333;
    margin-top: 5px;
}

.milestone-badge {
    font-size: 1.5rem;
    margin-left: 8px;
}

.milestone-section {
    width: 100%;
    max-width: 500px;
    margin-bottom: 20px;
}

.milestone-progress {
    height: 24px;
    background: #e0e0e0;
    border-radius: 12px;
    border: 3px solid #333;
    overflow: hidden;
    position: relative;
}

.milestone-bar {
    height: 100%;
    background: linear-gradient(90deg, #4caf50, #8bc34a);
    border-radius: 9px;
    transition: width 0.5s ease;
    width: 0%;
}

.milestone-text {
    text-align: center;
    margin-top: 8px;
    font-size: 0.9rem;
    color: #555;
    font-weight: 600;
}

.stamp-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 500px;
    margin-bottom: 20px;
    padding: 20px;
    background: #fff;
    border-radius: 16px;
    border: 4px solid #333;
    box-shadow: 0 6px 0 #e0c030;
}

.stamp-cell {
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    border: 3px solid #ccc;
    background: #f5f5f5;
    transition: all 0.3s ease;
    position: relative;
}

.stamp-cell.stamped {
    background: #ffeb3b;
    border-color: #f57f17;
    animation: stampPop 0.4s ease;
    box-shadow: 0 3px 0 #f57f17;
}

.stamp-cell.milestone-cell {
    border-color: #d32f2f;
    border-width: 4px;
}

.stamp-cell.milestone-cell.stamped {
    background: #ff5722;
    border-color: #b71c1c;
    box-shadow: 0 3px 0 #b71c1c;
}

@keyframes stampPop {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); opacity: 1; }
}

.stamp-action {
    width: 100%;
    max-width: 500px;
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.stamp-btn {
    background: #2196f3;
    color: white;
    box-shadow: 0 5px 0 #1565c0;
    flex: 3;
}

.stamp-btn:hover {
    background: #1e88e5;
}

.reset-btn {
    background: #ff9800;
    color: white;
    box-shadow: 0 5px 0 #e65100;
    flex: 1;
    font-size: 0.9rem;
}

.reset-btn:hover {
    background: #fb8c00;
}

.milestones-history {
    width: 100%;
    max-width: 500px;
    margin-bottom: 20px;
}

.section-title {
    font-size: 1.2rem;
    color: #333;
    margin-bottom: 10px;
    text-align: center;
}

.milestone-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

.milestone-item {
    background: #fff;
    border: 3px solid #333;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 1.1rem;
    box-shadow: 0 3px 0 #ccc;
    display: flex;
    align-items: center;
    gap: 6px;
}

.settings-section {
    width: 100%;
    max-width: 500px;
    margin-bottom: 20px;
}

.settings-btn {
    background: #9e9e9e;
    color: white;
    box-shadow: 0 5px 0 #616161;
}

.settings-panel {
    margin-top: 15px;
    padding: 20px;
    background: #fff;
    border-radius: 12px;
    border: 3px solid #333;
}

.settings-panel label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: 600;
    color: #333;
}

#change-password-btn, #save-name-btn {
    background: #7b1fa2;
    color: white;
    box-shadow: 0 4px 0 #4a148c;
}

@media (max-width: 400px) {
    .stamp-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        padding: 12px;
    }

    .stamp-cell {
        font-size: 1.3rem;
    }

    .lego-title {
        font-size: 1.5rem;
    }

    body {
        padding: 10px;
    }
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(circle, rgba(0,0,0,0.05) 10px, transparent 10px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: -1;
}
    </style>
</head>
<body>
    <!-- 密碼畫面 -->
    <div id="login-screen" class="screen">
        <div class="lego-card login-card">
            <h1 class="lego-title">🧱 樂高集點卡</h1>
            <p class="login-subtitle">請輸入密碼進入</p>
            <input type="password" id="password-input" class="lego-input" placeholder="密碼" autocomplete="off">
            <button id="login-btn" class="lego-btn">進入 🔓</button>
            <p id="login-error" class="error-msg hidden">密碼錯誤，再試一次！</p>
        </div>
    </div>

    <!-- 主畫面 -->
    <div id="main-screen" class="screen hidden">
        <div class="header">
            <h1 class="lego-title">🧱 集點卡</h1>
            <div class="stats">
                <span id="total-points">0</span> 點
                <span class="milestone-badge" id="milestone-badge"></span>
            </div>
        </div>

        <!-- 里程碑進度 -->
        <div class="milestone-section">
            <div class="milestone-progress">
                <div class="milestone-bar" id="milestone-bar"></div>
            </div>
            <p class="milestone-text" id="milestone-text">距離下一個里程碑還需要 10 點</p>
        </div>

        <!-- 集點區 -->
        <div class="stamp-grid" id="stamp-grid"></div>

        <!-- 里程碑歷史 -->
        <div class="milestones-history" id="milestones-history">
            <h2 class="section-title">🏆 里程碑紀錄</h2>
            <div class="milestone-list" id="milestone-list"></div>
        </div>

        <!-- 家長蓋章按鈕 -->
        <div class="stamp-action">
            <button id="stamp-btn" class="lego-btn stamp-btn">🖐️ 蓋章 +1</button>
            <button id="reset-btn" class="lego-btn reset-btn">🔄 重置</button>
        </div>

        <!-- 設定區 -->
        <div class="settings-section">
            <button id="settings-toggle" class="lego-btn settings-btn">⚙️ 設定</button>
            <div id="settings-panel" class="settings-panel hidden">
                <label>更改密碼：</label>
                <input type="password" id="new-password" class="lego-input" placeholder="新密碼">
                <button id="change-password-btn" class="lego-btn">確認更改</button>
                <label>孩子名稱：</label>
                <input type="text" id="child-name" class="lego-input" placeholder="名字">
                <button id="save-name-btn" class="lego-btn">儲存名稱</button>
            </div>
        </div>
    </div>

    <script>
const DEFAULT_PASSWORD = '1234';
const STAMPS_PER_MILESTONE = 10;

const MILESTONE_ICONS = [
    '⭐', '🚀', '🏆', '🎨', '🦄',
    '🌈', '🎯', '👑', '💎', '🔥',
    '🎪', '🎸', '🌟', '🏅', '🎉'
];

const STAMP_ICON = '🧱';
const EMPTY_ICON = '⬜';

let state = loadState();

const loginScreen = document.getElementById('login-screen');
const mainScreen = document.getElementById('main-screen');
const passwordInput = document.getElementById('password-input');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const totalPoints = document.getElementById('total-points');
const milestoneBadge = document.getElementById('milestone-badge');
const milestoneBar = document.getElementById('milestone-bar');
const milestoneText = document.getElementById('milestone-text');
const stampGrid = document.getElementById('stamp-grid');
const milestoneList = document.getElementById('milestone-list');
const milestonesHistory = document.getElementById('milestones-history');
const stampBtn = document.getElementById('stamp-btn');
const resetBtn = document.getElementById('reset-btn');
const settingsToggle = document.getElementById('settings-toggle');
const settingsPanel = document.getElementById('settings-panel');
const newPasswordInput = document.getElementById('new-password');
const changePasswordBtn = document.getElementById('change-password-btn');
const childNameInput = document.getElementById('child-name');
const saveNameBtn = document.getElementById('save-name-btn');

function init() {
    bindEvents();
    if (sessionStorage.getItem('loggedIn') === 'true') {
        showMainScreen();
    }
}

function bindEvents() {
    loginBtn.addEventListener('click', handleLogin);
    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
    stampBtn.addEventListener('click', handleStamp);
    resetBtn.addEventListener('click', handleReset);
    settingsToggle.addEventListener('click', toggleSettings);
    changePasswordBtn.addEventListener('click', handleChangePassword);
    saveNameBtn.addEventListener('click', handleSaveName);
}

function handleLogin() {
    const password = state.password || DEFAULT_PASSWORD;
    if (passwordInput.value === password) {
        loginError.classList.add('hidden');
        sessionStorage.setItem('loggedIn', 'true');
        showMainScreen();
    } else {
        loginError.classList.remove('hidden');
        passwordInput.value = '';
        passwordInput.focus();
    }
}

function showMainScreen() {
    loginScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    renderAll();
}

function renderAll() {
    renderStats();
    renderStampGrid();
    renderMilestones();
    updateTitle();
}

function updateTitle() {
    if (state.childName) {
        document.querySelector('.lego-title').textContent = '🧱 ' + state.childName + '的集點卡';
    }
}

function renderStats() {
    totalPoints.textContent = state.points;
    const completedMilestones = Math.floor(state.points / STAMPS_PER_MILESTONE);
    if (completedMilestones > 0) {
        const iconIndex = (completedMilestones - 1) % MILESTONE_ICONS.length;
        milestoneBadge.textContent = MILESTONE_ICONS[iconIndex];
    } else {
        milestoneBadge.textContent = '';
    }

    const currentProgress = state.points % STAMPS_PER_MILESTONE;
    const percentage = (currentProgress / STAMPS_PER_MILESTONE) * 100;
    milestoneBar.style.width = percentage + '%';

    const remaining = STAMPS_PER_MILESTONE - currentProgress;
    if (currentProgress === 0 && state.points > 0) {
        milestoneText.textContent = '🎉 剛達成里程碑！繼續加油！';
        milestoneBar.style.width = '100%';
    } else {
        milestoneText.textContent = '距離下一個里程碑還需要 ' + remaining + ' 點';
    }
}

function renderStampGrid() {
    stampGrid.innerHTML = '';
    const currentProgress = state.points % STAMPS_PER_MILESTONE;

    for (let i = 0; i < STAMPS_PER_MILESTONE; i++) {
        const cell = document.createElement('div');
        cell.classList.add('stamp-cell');

        if (i === STAMPS_PER_MILESTONE - 1) {
            cell.classList.add('milestone-cell');
        }

        if (i < currentProgress) {
            cell.classList.add('stamped');
            cell.textContent = STAMP_ICON;
        } else if (i === STAMPS_PER_MILESTONE - 1) {
            cell.textContent = '🎯';
        } else {
            cell.textContent = EMPTY_ICON;
        }

        stampGrid.appendChild(cell);
    }
}

function renderMilestones() {
    const completedMilestones = Math.floor(state.points / STAMPS_PER_MILESTONE);
    
    if (completedMilestones === 0) {
        milestonesHistory.classList.add('hidden');
        return;
    }

    milestonesHistory.classList.remove('hidden');
    milestoneList.innerHTML = '';

    for (let i = 0; i < completedMilestones; i++) {
        const item = document.createElement('div');
        item.classList.add('milestone-item');
        const iconIndex = i % MILESTONE_ICONS.length;
        item.innerHTML = MILESTONE_ICONS[iconIndex] + ' <span>第 ' + (i + 1) + ' 個里程碑</span>';
        milestoneList.appendChild(item);
    }
}

function handleStamp() {
    state.points++;
    saveState();
    renderAll();

    if (state.points % STAMPS_PER_MILESTONE === 0) {
        celebrateMilestone();
    }
}

function celebrateMilestone() {
    const milestoneNum = state.points / STAMPS_PER_MILESTONE;
    const iconIndex = (milestoneNum - 1) % MILESTONE_ICONS.length;
    
    const celebration = document.createElement('div');
    celebration.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4rem;z-index:1000;animation:stampPop 0.8s ease forwards;pointer-events:none;';
    celebration.textContent = '🎉 ' + MILESTONE_ICONS[iconIndex] + ' 🎉';
    document.body.appendChild(celebration);
    
    setTimeout(function() { celebration.remove(); }, 1500);
}

function handleReset() {
    if (confirm('確定要重置所有點數嗎？這個動作無法復原！')) {
        state.points = 0;
        saveState();
        renderAll();
    }
}

function toggleSettings() {
    settingsPanel.classList.toggle('hidden');
    if (!settingsPanel.classList.contains('hidden')) {
        childNameInput.value = state.childName || '';
    }
}

function handleChangePassword() {
    const newPass = newPasswordInput.value.trim();
    if (newPass.length < 1) {
        alert('密碼不能為空！');
        return;
    }
    state.password = newPass;
    saveState();
    newPasswordInput.value = '';
    alert('密碼已更改！');
}

function handleSaveName() {
    state.childName = childNameInput.value.trim();
    saveState();
    updateTitle();
    alert('名稱已儲存！');
}

function loadState() {
    const saved = localStorage.getItem('legoStampCard');
    if (saved) {
        return JSON.parse(saved);
    }
    return {
        points: 0,
        password: DEFAULT_PASSWORD,
        childName: ''
    };
}

function saveState() {
    localStorage.setItem('legoStampCard', JSON.stringify(state));
}

init();
    </script>
</body>
</html>
